<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  :root{
    --pink:#ff5c8a; --pink2:#ff8fb0;
    --orange:#ff8a3d; --orange2:#ffb15c;
    --ink:#2b2230; --muted:#8a7f90;
    --card:#ffffff; --bg:#fff5f7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%; max-width:480px; min-height:100dvh;
    display:flex; flex-direction:column; position:relative;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .screen{display:none; flex:1; flex-direction:column; padding:22px 20px 28px;}
  .screen.active{display:flex; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ===== HOME ===== */
  .home{justify-content:center; text-align:center; gap:8px;}
  .logo{font-size:30px; font-weight:800; letter-spacing:1px; margin-bottom:2px;}
  .logo small{display:block; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:2px; margin-top:6px;}
  .home-sub{color:var(--muted); font-size:14px; margin-bottom:26px;}
  .mode-btn{
    border:none; border-radius:24px; padding:26px 20px; margin:9px 0;
    color:#fff; font-size:21px; font-weight:800; cursor:pointer;
    box-shadow:0 12px 26px rgba(0,0,0,.14); transition:transform .12s;
    display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .mode-btn:active{transform:scale(.97);}
  .mode-btn span{font-size:13px; font-weight:600; opacity:.92;}
  .mode-futari{background:linear-gradient(135deg,var(--pink),var(--pink2));}
  .mode-enkai{background:linear-gradient(135deg,var(--orange),var(--orange2));}
  .home-foot{margin-top:30px; font-size:12px; color:var(--muted);}

  /* ===== shared header ===== */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .back{background:none; border:none; font-size:16px; color:var(--ink); cursor:pointer; padding:6px 4px; font-weight:700;}
  .title{font-size:17px; font-weight:800;}
  .sound{background:none;border:none;font-size:20px;cursor:pointer;padding:4px;}

  /* segmented control */
  .seg{display:flex; background:#fff; border-radius:14px; padding:4px; box-shadow:0 4px 12px rgba(0,0,0,.06); margin-bottom:12px;}
  .seg button{flex:1; border:none; background:none; padding:10px 4px; border-radius:10px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; transition:.15s;}
  .seg button.on{color:#fff;}
  .futari .seg button.on{background:var(--pink);}
  .enkai .seg button.on{background:var(--orange);}

  .row{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; font-weight:700; color:var(--muted);}
  .switch{margin-left:auto; position:relative; width:50px; height:28px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:#e3dbe6; border-radius:30px; transition:.2s; cursor:pointer;}
  .slider:before{content:""; position:absolute; height:22px; width:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--orange);}
  .switch input:checked + .slider:before{transform:translateX(22px);}

  /* card */
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px;}
  .card{
    width:100%; background:var(--card); border-radius:26px; padding:34px 24px;
    box-shadow:0 16px 40px rgba(0,0,0,.12); text-align:center; min-height:230px;
    display:flex; flex-direction:column; justify-content:center; gap:16px;
    position:relative; overflow:hidden;
  }
  .card.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{0%{transform:scale(.9) rotate(-1deg); opacity:.3;}100%{transform:none; opacity:1;}}
  .badge{align-self:center; font-size:12px; font-weight:800; padding:6px 14px; border-radius:30px; color:#fff;}
  .b-pink{background:var(--pink);} .b-orange{background:var(--orange);} .b-red{background:#ff4d63;} .b-blue{background:#5b8cff;}
  .card .text{font-size:23px; font-weight:800; line-height:1.5;}
  .card .hint{font-size:13px; color:var(--muted); font-weight:600;}
  .card .who{font-size:15px; font-weight:800; color:var(--orange);}

  .actions{display:flex; gap:12px; width:100%;}
  .btn{flex:1; border:none; border-radius:18px; padding:18px; font-size:17px; font-weight:800; cursor:pointer; transition:transform .1s; box-shadow:0 8px 18px rgba(0,0,0,.12);}
  .btn:active{transform:scale(.96);}
  .btn-main{color:#fff;}
  .futari .btn-main{background:linear-gradient(135deg,var(--pink),var(--pink2));}
  .enkai .btn-main{background:linear-gradient(135deg,var(--orange),var(--orange2));}
  .btn-ghost{flex:0 0 34%; background:#fff; color:var(--muted);}

  .names{width:100%; margin-bottom:6px;}
  .name-add{display:flex; gap:8px;}
  .name-add input{flex:1; border:1.5px solid #eadfe6; border-radius:14px; padding:12px 14px; font-size:15px; outline:none; min-width:0;}
  .name-add input:focus{border-color:var(--orange);}
  .addbtn{flex:0 0 auto; border:none; background:var(--orange); color:#fff; font-weight:800; font-size:14px; border-radius:14px; padding:0 16px; cursor:pointer;}
  .addbtn:active{transform:scale(.96);}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; min-height:2px;}
  .chip{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid #ffe0c8; color:var(--ink); font-weight:700; font-size:14px; padding:7px 8px 7px 14px; border-radius:30px; box-shadow:0 2px 6px rgba(0,0,0,.05);}
  .chip button{border:none; background:#ffe7d6; color:var(--orange); width:22px; height:22px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer; font-weight:800;}
  .chip button:active{transform:scale(.9);}
  .names .tip{font-size:11px; color:var(--muted); margin:8px 2px 0;}

  .spin{filter:blur(.3px); opacity:.55; transition:none;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen home active">
    <div class="logo">ねぇ、これしよ<small>FUTARI &amp; ENKAI</small></div>
    <div class="home-sub">「何する？」をなくす、距離が縮まるアプリ</div>
    <button class="mode-btn mode-futari" onclick="openFutari()">💞 ふたりモード<span>デート・ふたりの時間に。距離を縮めるお題</span></button>
    <button class="mode-btn mode-enkai" onclick="openEnkai()">🍻 宴会モード<span>みんなで盛り上がる！お題＆罰ゲームルーレット</span></button>
    <div class="home-foot">気まずくなったら「パス」でOK。無理なお題はスキップしよう。</div>
  </section>

  <!-- FUTARI -->
  <section id="futari" class="screen futari">
    <div class="topbar">
      <button class="back" onclick="go('home')">‹ もどる</button>
      <div class="title">💞 ふたりモード</div>
      <button class="sound" onclick="toggleSound(this)">🔊</button>
    </div>
    <div class="seg" id="fLevel">
      <button data-lv="1" class="on">ライト</button>
      <button data-lv="2">ふつう</button>
      <button data-lv="3">ちょっとドキッ</button>
    </div>
    <div class="stage">
      <div class="card" id="fCard">
        <div class="badge b-pink">START</div>
        <div class="text">レベルを選んで<br>「お題を出す」を押してね</div>
        <div class="hint">二人でこの画面を見ながらどうぞ</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="passFutari()">パス</button>
        <button class="btn btn-main" onclick="nextFutari()">お題を出す</button>
      </div>
    </div>
  </section>

  <!-- ENKAI -->
  <section id="enkai" class="screen enkai">
    <div class="topbar">
      <button class="back" onclick="go('home')">‹ もどる</button>
      <div class="title">🍻 宴会モード</div>
      <button class="sound" onclick="toggleSound(this)">🔊</button>
    </div>

    <div class="seg" id="eType">
      <button data-type="mix" class="on">おまかせ</button>
      <button data-type="odai">お題</button>
      <button data-type="batsu">罰ゲーム</button>
    </div>
    <div class="seg" id="eLevel">
      <button data-lv="1" class="on">ゆるめ</button>
      <button data-lv="2">ふつう</button>
      <button data-lv="3">鬼</button>
    </div>
    <div class="row">
      🍵 お酒なしモード
      <label class="switch"><input type="checkbox" id="noAlcohol"><span class="slider"></span></label>
    </div>
    <div class="names">
      <div class="name-add">
        <input id="nameInput" type="text" placeholder="名前を入力（例：たろう）" maxlength="12" />
        <button type="button" class="addbtn" onclick="addMember()">＋ 追加</button>
      </div>
      <div id="memberList" class="chips"></div>
      <div class="tip">参加者を1人ずつ追加。入れると「誰がやるか」もルーレットで決めます（空ならお題だけ）</div>
    </div>

    <div class="stage">
      <div class="card" id="eCard">
        <div class="badge b-orange">READY</div>
        <div class="text">設定したら<br>「回す！」を押してね</div>
        <div class="hint">ドラムロール 🥁 から結果発表まで一気に！</div>
      </div>
      <div class="actions">
        <button class="btn btn-main" onclick="spinEnkai()" id="spinBtn">回す！🎲</button>
      </div>
    </div>
  </section>

</div>

/* ================= 共通 ================= */
let soundOn = true;
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function openFutari(){ resetFutari(); go('futari'); }
function openEnkai(){ go('enkai'); }
function toggleSound(btn){ soundOn=!soundOn; btn.textContent = soundOn?'🔊':'🔈'; }

// セグメント切り替え
document.querySelectorAll('.seg').forEach(seg=>{
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(seg.id==='fLevel') resetFutari();
  });
});
function segVal(id,attr){ return document.querySelector('#'+id+' button.on').dataset[attr]; }

/* ================= サウンド（Web Audio） ================= */
let actx;
function ac(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq,dur,type='sine',vol=.2,when=0){
  if(!soundOn) return;
  const c=ac(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const t=c.currentTime+when;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur);
}
function drumroll(ms){
  if(!soundOn) return;
  let t=0;
  const id=setInterval(()=>{ beep(90+Math.random()*40,.05,'square',.12); },45);
  setTimeout(()=>clearInterval(id),ms);
}
function fanfare(){ beep(523,.12,'triangle',.25,0); beep(659,.12,'triangle',.25,.12); beep(784,.25,'triangle',.28,.24); }
function ding(){ beep(880,.12,'sine',.22); beep(1320,.18,'sine',.18,.06); }

/* ================= ふたりモード ================= */
function resetFutari(){ /* 完全ランダムのため事前準備は不要 */ }
function nextFutari(){
  const lv=+segVal('fLevel','lv');
  const list=FUTARI.filter(x=>x.lv===lv);
  const item=list[Math.floor(Math.random()*list.length)];
  renderFutari(item);
  ding();
}
function passFutari(){ nextFutari(); }
function renderFutari(it){
  const c=document.getElementById('fCard');
  c.innerHTML = `<div class="badge b-pink">${it.cat}</div>
    <div class="text">${it.t}</div>
    <div class="hint">気が向いたらどうぞ・無理なら「パス」でOK</div>`;
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
}

/* ================= 宴会モード ================= */
function buildEnkaiPool(){
  const type=segVal('eType','type');
  const lv=+segVal('eLevel','lv');
  const noAlc=document.getElementById('noAlcohol').checked;
  let pool=[];
  const odai = ENKAI_ODAI.filter(x=>x.lv<=lv).map(x=>({kind:'odai',...x}));
  let batsu = ENKAI_BATSU.filter(x=>x.lv===lv);
  if(noAlc) batsu=batsu.filter(x=>!x.alc);
  batsu = batsu.map(x=>({kind:'batsu',...x}));
  if(type==='odai') pool=odai;
  else if(type==='batsu') pool=batsu;
  else pool=odai.concat(batsu);
  return pool;
}
let members = []; // 指名する参加者
function addMember(){
  const input=document.getElementById('nameInput');
  const name=input.value.trim();
  input.value=''; input.focus();
  if(!name) return;
  if(members.includes(name)) return; // 同名は追加しない
  members.push(name);
  renderMembers();
}
function removeMember(i){ members.splice(i,1); renderMembers(); }
function renderMembers(){
  document.getElementById('memberList').innerHTML =
    members.map((n,i)=>`<span class="chip">${esc(n)}<button onclick="removeMember(${i})">×</button></span>`).join('');
}
function getNames(){ return members.slice(); }
// Enterキーでも追加
document.getElementById('nameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); addMember(); }
});
function spinEnkai(){
  const pool=buildEnkaiPool();
  if(pool.length===0){ alert('条件に合うお題がありません。設定を変えてね'); return; }
  const names=getNames();
  const btn=document.getElementById('spinBtn'); btn.disabled=true;
  const c=document.getElementById('eCard');
  drumroll(1300);

  let n=0; const total=16;
  const tick=()=>{
    const peek=pool[Math.floor(Math.random()*pool.length)];
    const who=names.length?names[Math.floor(Math.random()*names.length)]:'';
    c.classList.add('spin');
    c.innerHTML=`<div class="badge b-orange">？？？</div>
      ${who?`<div class="who">${esc(who)}</div>`:''}
      <div class="text">${peek.t}</div>`;
    n++;
    if(n<total){ setTimeout(tick, 60+n*8); }
    else finishEnkai(pool, names);
  };
  tick();
}
function finishEnkai(pool, names){
  // 完全ランダム（被ってもOK）
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const who=names.length?names[Math.floor(Math.random()*names.length)]:'';
  const c=document.getElementById('eCard');
  c.classList.remove('spin');
  const badge = pick.kind==='batsu'
    ? `<div class="badge b-red">罰ゲーム${pick.alc?' 🍺':''}</div>`
    : `<div class="badge b-blue">お題</div>`;
  c.innerHTML = `${badge}
    ${who?`<div class="who">👉 ${esc(who)} の番！</div>`:''}
    <div class="text">${pick.t}</div>
    <div class="hint">${pick.kind==='batsu'?'がんばれ！次は誰だ…？':'みんなで答えよう'}</div>`;
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  if(pick.kind==='batsu') fanfare(); else ding();
  document.getElementById('spinBtn').disabled=false;
}

/* ================= util ================= */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ================= PWA（ホーム画面アプリ化・オフライン対応） ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
